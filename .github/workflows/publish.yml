name: Publish to npm

# Release flow: bump + tag locally, push the tag, this workflow publishes.
#
#   npm version patch          # or minor / major - bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags     # the tag triggers this workflow
#
# No token, no secret: publishing uses npm Trusted Publishing (OIDC).
# The trust is configured on npmjs.com -> package Settings -> Trusted Publisher
# (Moksa1123/gutenberg-headless, workflow publish.yml). Requires npm >= 11.5.1,
# which Node 24 bundles.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm must support trusted publishing (>= 11.5.1)
        run: npm --version

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG != package.json $PKG - bump with 'npm version', don't hand-edit tags."
            exit 1
          fi

      - name: Smoke-test the installer (all strategies, dry paths)
        run: |
          node bin/install.mjs --list
          node bin/install.mjs --dry-run claude-code
          node bin/install.mjs claude-code --to /tmp/skill-e2e --force
          test -f /tmp/skill-e2e/skills/gutenberg-headless/SKILL.md
          test -f /tmp/skill-e2e/skills/gutenberg-headless/data/block-schema.json
          node bin/install.mjs cursor --to /tmp/rule-e2e --force
          test -f /tmp/rule-e2e/rules/gutenberg-headless.mdc

      - name: Validate the shipped example pages against the shipped schema
        run: |
          python3 tools/validate-post.py examples/demo-page.html
          python3 tools/validate-post.py examples/fidelity-blocks.html
          python3 tools/validate-post.py examples/onepage-woo.html

      - name: Publish (OIDC trusted publishing - no token)
        run: npm publish --access public
